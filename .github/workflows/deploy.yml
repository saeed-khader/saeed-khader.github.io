name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Fix GitHub Pages paths
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const root = ".output/public";
          const base = "/saeed-portfolio-v2";

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);

              if (entry.isDirectory()) {
                walk(full);
                continue;
              }

              if (!/\.(html|js|mjs|css)$/.test(entry.name)) {
                continue;
              }

              let content = fs.readFileSync(full, "utf8");

              content = content.replaceAll('"/assets/', `"${base}/assets/`);
              content = content.replaceAll("'\/assets/", `'${base}/assets/`);

              content = content.replaceAll('"/brand/', `"${base}/brand/`);
              content = content.replaceAll("'\/brand/", `'${base}/brand/`);

              content = content.replaceAll(
                '"/saeed-alzahrani-cv.pdf"',
                `"${base}/saeed-alzahrani-cv.pdf"`
              );

              content = content.replaceAll(
                'href="/"',
                `href="${base}/"`
              );

              fs.writeFileSync(full, content);
            }
          }

          walk(root);

          console.log("GitHub Pages paths fixed successfully.");
          NODE

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
